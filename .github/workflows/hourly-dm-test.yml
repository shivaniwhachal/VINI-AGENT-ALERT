name: Hourly DM

# The 9:00 PM–3:00 AM tester clock is finished.
# workflow_dispatch can still DM one date. This file never posts to a channel.
# The everyday send is daily-dm.yml at 5:30 PM IST.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to DM. One date. Never a channel."
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a font for the table
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: DM one date from the Alerts tab
        env:
          MODE: hourly-test
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NOTIFY_USER_ID: ${{ secrets.SLACK_NOTIFY_USER_ID }}
          TEST_WINDOW_END: "2026-10-17T03:45:00+05:30"
          REPORT_DATE: ${{ github.event.inputs.date }}
        run: python -m vini_alert
