name: Daily DM

# 12:00 UTC is 5:30 PM IST, Monday through Saturday.
# Sunday has no run. Monday's image is Saturday. Tuesday–Saturday use yesterday.
# workflow_dispatch can DM one YYYY-MM-DD. This file never posts to a channel.
on:
  schedule:
    - cron: "0 12 * * 1-6"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to DM. Blank uses the 5:30 PM calendar. Never a channel."
        required: false
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a font for the table
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: DM the Alerts tab for one date
        env:
          MODE: production
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NOTIFY_USER_ID: ${{ secrets.SLACK_NOTIFY_USER_ID }}
          REPORT_DATE: ${{ github.event.inputs.date }}
        run: python -m vini_alert
